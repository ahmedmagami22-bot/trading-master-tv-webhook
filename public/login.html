<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trading Master V4 Login</title>
<style>
body{margin:0;font-family:system-ui,Tahoma;background:#07100d;color:#eef8f2;display:grid;place-items:center;min-height:100vh}
.card{width:min(430px,92vw);background:#0e1b16;border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:28px;box-shadow:0 20px 70px rgba(0,0,0,.35)}
h1{margin:0 0 8px;font-size:24px}
p{color:#9fb3aa;margin:0 0 22px}
input{width:100%;box-sizing:border-box;margin:8px 0;padding:14px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:#07100d;color:#fff;font-size:15px}
button{width:100%;margin-top:12px;padding:14px 16px;border:0;border-radius:14px;background:#d2a971;color:#07100d;font-weight:800;cursor:pointer}
button:disabled{opacity:.65;cursor:not-allowed}
.err{margin-top:12px;color:#ff8a8a;font-size:14px;min-height:20px}
.ok{margin-top:12px;color:#72e0a2;font-size:14px;min-height:20px}
small{display:block;color:#7f928a;margin-top:16px;line-height:1.6}
</style>
</head>
<body>
<div class="card">
  <h1>Trading Master V4</h1>
  <p>TradingView Webhook Signal Dashboard</p>
  <input id="email" placeholder="Email" autocomplete="email">
  <input id="password" placeholder="Password" type="password" autocomplete="current-password">
  <button id="loginBtn">تسجيل الدخول</button>
  <div class="err" id="err"></div>
  <div class="ok" id="ok"></div>
  <small>تسجيل الدخول يتم الآن من خلال API داخلي آمن على Vercel، لتجنب مشاكل الاتصال المباشر من المتصفح.</small>
</div>

<script>
const err = document.getElementById('err');
const ok = document.getElementById('ok');
const btn = document.getElementById('loginBtn');

btn.onclick = async () => {
  err.textContent = '';
  ok.textContent = '';
  btn.disabled = true;
  btn.textContent = 'جاري الدخول...';

  try {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const r = await fetch('/api/login-server', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ email, password })
    });

    const data = await r.json().catch(() => ({}));

    if (!r.ok || !data.ok || !data.access_token) {
      throw new Error(data.message || 'Login failed');
    }

    localStorage.setItem('tm_v4_access_token', data.access_token);
    ok.textContent = 'تم تسجيل الدخول بنجاح...';
    setTimeout(() => { location.href = '/'; }, 400);
  } catch (e) {
    err.textContent = e.message || 'Failed to login';
  } finally {
    btn.disabled = false;
    btn.textContent = 'تسجيل الدخول';
  }
};
</script>
</body>
</html>
